name: Actualizar eventos

on:
  schedule:
    - cron: '7 12 * * *'   # todos los días ~6:07 am hora de Monterrey
  workflow_dispatch:        # botón "Run workflow" para correrlo a mano

permissions:
  contents: write

concurrency:
  group: actualizar-eventos
  cancel-in-progress: false

jobs:
  recolectar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Juntar eventos
        env:
          TM_API_KEY: ${{ secrets.TM_API_KEY }}
        run: node collector/index.js
      - name: Guardar cambios
        run: |
          git config user.name "eventos-bot"
          git config user.email "eventos-bot@users.noreply.github.com"
          git add data/events.json
          git diff --cached --quiet || git commit -m "Eventos actualizados $(date -u +%Y-%m-%d)"
          git push
