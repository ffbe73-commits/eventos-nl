name: Crear APK

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar proyecto de la app
        run: |
          mkdir movil
          cp App.js app.json icon.png movil/
          cp app-package.json movil/package.json
          cd movil
          npm install

      - name: Generar proyecto Android
        run: |
          cd movil
          CI=1 npx expo prebuild --platform android --no-install

      - name: Compilar APK
        run: |
          cd movil/android
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: EventosNL-apk
          path: movil/android/app/build/outputs/apk/release/app-release.apk
