name: Diagnosticar APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Activar emulador (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Preparar proyecto de la app
        run: |
          mkdir movil
          cp App.js app.json icon.png entrada.js movil/
          cp app-package.json movil/package.json
          cd movil
          npm install
          CI=1 npx expo prebuild --platform android --no-install

      - name: Compilar APK (incluye versión para emulador)
        run: |
          cd movil/android
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64,armeabi-v7a,arm64-v8a

      - name: Abrir la app en un celular virtual y grabar qué pasa
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r movil/android/app/build/outputs/apk/release/app-release.apk
            adb logcat -c
            bash diagnostico-toques.sh > pasos.txt 2>&1 || true
            adb logcat -d -v time > logcat.txt

      - name: Guardar diagnóstico en el repositorio
        if: always()
        run: |
          mkdir -p diagnostico
          [ -f pasos.txt ] && cp pasos.txt diagnostico/pasos.txt || true
          rm -rf diagnostico/capturas; [ -d capturas ] && cp -r capturas diagnostico/capturas || true
          if [ -f logcat.txt ]; then
            grep -E "FATAL|AndroidRuntime|ReactNative|ReactNativeJS|Hermes|Expo|expo|eventosnl|SoLoader|UnsatisfiedLink|Exception|Error" logcat.txt | head -n 1500 > diagnostico/errores.txt || true
            tail -n 1500 logcat.txt > diagnostico/logcat-final.txt
          else
            echo "No se generó logcat" > diagnostico/errores.txt
          fi
          git config user.name "diagnostico-bot"
          git config user.email "diagnostico-bot@users.noreply.github.com"
          git add diagnostico
          git commit -m "Diagnóstico del APK" || exit 0
          git pull --rebase
          git push
